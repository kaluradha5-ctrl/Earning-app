<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kismat Quest - Reward App</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 5px; }
        .user-info {
            background: #334155;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .coins-display {
            font-size: 22px;
            font-weight: bold;
            color: #facc15;
            margin-top: 5px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 10px;
        }
        .earn-btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            font-size: 16px;
            color: #ffffff;
            background: #2563eb;
            margin-bottom: 25px;
            transition: 0.2s;
        }
        .earn-btn:hover { opacity: 0.9; }
        
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #ffffff;
            font-size: 14px;
        }
        .withdraw-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .withdraw-btn {
            background: #334155;
            border: 1px solid #475569;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .withdraw-btn:hover {
            background: #02c59a;
            border-color: #02c59a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Kismat Quest Rewards</h2>
        
        <!-- User ID & Coins Info -->
        <div class="user-info">
            <div>User ID: <span id="display-user-id" style="color: #38bdf8;">--</span></div>
            <div class="coins-display">🪙 Coins: <span id="display-coins">0</span></div>
        </div>

        <!-- Task Section (CPX Hata diya gaya hai, sirf Torox hai) -->
        <div class="section-title">🔥 Tasks & Offers</div>
        <a id="torox-link" href="#" target="_blank" class="earn-btn">
            Open Torox Offerwall
        </a>

        <!-- Old Withdrawal System -->
        <div class="section-title">💳 Withdraw Money</div>
        <div class="input-group">
            <label for="upiId">Paytm Mobile Number / UPI ID:</label>
            <input type="text" id="upiId" placeholder="e.g. 9876543210@paytm">
        </div>

        <div style="font-size: 13px; font-weight: 600; color: #e2e8f0; margin-bottom: 10px;">Rashi Chunein:</div>
        <div class="withdraw-grid">
            <button class="withdraw-btn" onclick="requestWithdraw(2000, 50)">💸 ₹50 (2000 C)</button>
            <button class="withdraw-btn" onclick="requestWithdraw(4000, 100)">💸 ₹100 (4000 C)</button>
            <button class="withdraw-btn" onclick="requestWithdraw(6000, 150)">💸 ₹150 (6000 C)</button>
            <button class="withdraw-btn" onclick="requestWithdraw(8000, 200)">💸 ₹200 (8000 C)</button>
            <button class="withdraw-btn" onclick="requestWithdraw(10000, 250)">💸 ₹250 (10000 C)</button>
            <button class="withdraw-btn" onclick="requestWithdraw(20000, 500)">💸 ₹500 (20000 C)</button>
        </div>
    </div>

    <script>
        // Old User ID Management Logic
        let userId = localStorage.getItem("kismat_user_id");
        if (!userId) {
            userId = "user_" + Math.random().toString(36).substring(2, 10);
            localStorage.setItem("kismat_user_id", userId);
        }
        document.getElementById("display-user-id").innerText = userId;

        // Display Current Coins
        let currentCoins = parseInt(localStorage.getItem('coins')) || 0;
        document.getElementById("display-coins").innerText = currentCoins;

        // Torox Link Assignment
        let toroxUrl = "https://qckclk.com/wall/S?subid=" + userId;
        document.getElementById("torox-link").href = toroxUrl;

        // Old Withdrawal System Logic
        function requestWithdraw(requiredCoins, rupeeAmount) {
            const upi = document.getElementById('upiId').value.trim();
            if (!upi) {
                alert('⚠️ Kripya apna Paytm number ya UPI ID darj karein!');
                return;
            }

            const lastWithdrawDate = localStorage.getItem('last_withdraw_date');
            const today = new Date().toISOString().split('T')[0];

            if (lastWithdrawDate === today) {
                alert('⚠️ Aap aaj ka apna 1 withdrawal pehle hi laga chuke hain. Kal dobara prayas karein!');
                return;
            }

            let coins = parseInt(localStorage.getItem('coins')) || 0;

            if (coins < requiredCoins) {
                alert(`❌ Aparyapt Coins! ₹${rupeeAmount} ke liye minimum ${requiredCoins} coins hone chahiye.`);
                return;
            }

            coins -= requiredCoins;
            localStorage.setItem('coins', coins);
            localStorage.setItem('last_withdraw_date', today);

            alert(`✅ ₹${rupeeAmount} ki withdrawal request safaltapoorvak darj ho gayi hai! 24 ghante mein payment mil jayegi.`);
            location.reload();
        }
    </script>
</body>
</html>
