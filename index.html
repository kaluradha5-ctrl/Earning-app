<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kismat Quest Rewards</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #0f172a; color: #ffffff; margin: 0; padding: 15px; }
        .card { background: #1e293b; max-width: 450px; margin: auto; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        h2 { text-align: center; color: #38bdf8; margin: 0 0 15px 0; }
        .user-box { background: #334155; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        .coins { font-size: 20px; font-weight: bold; color: #facc15; margin-top: 5px; }
        .offer-btn { display: block; background: #2563eb; color: #fff; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; }
        .withdraw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .withdraw-btn { background: #334155; border: 1px solid #475569; color: #fff; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .withdraw-btn:hover { background: #02c59a; border-color: #02c59a; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Kismat Quest Rewards</h2>

        <div class="user-box">
            <div>User ID: <span id="user-id-text" style="color: #38bdf8;">--</span></div>
            <div class="coins">🪙 Coins: <span id="coins-text">0</span></div>
        </div>

        <div style="font-weight: bold; margin-bottom: 10px;">🔥 Tasks & Offers</div>
        <a id="torox-wall-link" href="#" target="_blank" class="offer-btn">Open Torox Offerwall</a>

        <div style="font-weight: bold; margin-bottom: 10px;">💳 Withdraw Money</div>
        <div class="input-group">
            <label>Paytm Mobile Number / UPI ID:</label>
            <input type="text" id="upiId" placeholder="e.g. 9876543210@paytm">
        </div>

        <div style="font-size: 13px; margin-bottom: 10px;">Rashi Chunein:</div>
        <div class="withdraw-grid">
            <button class="withdraw-btn" onclick="requestWithdraw(2000, 50)">💸 ₹50 (2000 C)</button>
            <button class="withdraw-btn" onclick="requestWithdraw(4000, 100)">💸 ₹100 (4000 C)</button>
            <button class="withdraw-btn" onclick="requestWithdraw(6000, 150)">💸 ₹150 (6000 C)</button>
            <button class="withdraw-btn" onclick="requestWithdraw(8000, 200)">💸 ₹200 (8000 C)</button>
            <button class="withdraw-btn" onclick="requestWithdraw(10000, 250)">💸 ₹250 (10000 C)</button>
            <button class="withdraw-btn" onclick="requestWithdraw(20000, 500)">💸 ₹500 (20000 C)</button>
        </div>
    </div>

    <script>
        // Real LocalStorage User ID
        let userId = localStorage.getItem("kismat_user_id");
        if (!userId) {
            userId = "user_" + Math.random().toString(36).substring(2, 10);
            localStorage.setItem("kismat_user_id", userId);
        }
        document.getElementById("user-id-text").innerText = userId;

        // Real LocalStorage Coins
        let currentCoins = parseInt(localStorage.getItem('coins')) || 0;
        document.getElementById("coins-text").innerText = currentCoins;

        // Torox Offerwall Real Dynamic SubID Link
        document.getElementById("torox-wall-link").href = "https://qckclk.com/wall/S?subid=" + userId;

        // Real Withdrawal System
        function requestWithdraw(requiredCoins, rupeeAmount) {
            const upi = document.getElementById('upiId').value.trim();
            if (!upi) {
                alert('⚠️ Kripya apna Paytm number ya UPI ID darj karein!');
                return;
            }

            const lastWithdrawDate = localStorage.getItem('last_withdraw_date');
            const today = new Date().toISOString().split('T')[0];

            if (lastWithdrawDate === today) {
                alert('⚠️ Aap aaj ka apna 1 withdrawal pehle hi laga chuke hain. Kal dobara prayas karein!');
                return;
            }

            let coins = parseInt(localStorage.getItem('coins')) || 0;

            if (coins < requiredCoins) {
                alert(`❌ Aparyapt Coins! ₹${rupeeAmount} ke liye minimum ${requiredCoins} coins hone chahiye.`);
                return;
            }

            coins -= requiredCoins;
            localStorage.setItem('coins', coins);
            localStorage.setItem('last_withdraw_date', today);

            alert(`✅ ₹${rupeeAmount} ki withdrawal request safaltapoorvak darj ho gayi hai! 24 ghante mein payment mil jayegi.`);
            location.reload();
        }
    </script>
</body>
</html>
